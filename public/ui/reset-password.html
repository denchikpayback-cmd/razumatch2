<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Новый пароль · RazuMATCH</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f5;font:16px system-ui,sans-serif;color:#27342c}.card{box-sizing:border-box;width:min(92vw,440px);padding:32px;background:#fff;border:1px solid #e3e7e1;border-radius:18px}h1{font-size:26px}label{display:block;margin:18px 0 6px;font-size:14px;font-weight:600}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd5cb;border-radius:9px;font:inherit}button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:#4a7456;color:#fff;cursor:pointer;font:600 16px system-ui}button:disabled{opacity:.6}a{color:#4a7456}.error{color:#aa3434}.ok{color:#387d43}#status{min-height:25px}</style></head>
<body><main class="card"><h1>Новый пароль</h1><p>Придумай новый пароль для своего аккаунта RazuMATCH.</p><form id="form"><label for="password">Новый пароль</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Повтори пароль</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="submit" type="submit">Сохранить новый пароль</button></form><p id="status" role="status"></p><a href="/ui/index.html">Вернуться ко входу</a></main>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
history.replaceState(null, '', location.pathname);
const status = document.getElementById('status');
if (!token) { status.className='error';status.textContent='В ссылке нет токена. Запроси восстановление заново.'; document.getElementById('form').hidden=true; }
document.getElementById('form').addEventListener('submit', async (event)=>{
 event.preventDefault();
 const password=document.getElementById('password').value, confirm=document.getElementById('confirm').value;
 if(password!==confirm){status.className='error';status.textContent='Пароли не совпадают';return}
 const button=document.getElementById('submit');button.disabled=true;
 try{
  const res=await fetch('/api/email/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
  const result=await res.json();if(!res.ok)throw new Error(result.error||'Не удалось сменить пароль');
  status.className='ok';status.textContent='Пароль изменён. Теперь можешь войти.';document.getElementById('form').hidden=true;
 }catch(error){status.className='error';status.textContent=error.message;}finally{button.disabled=false;}
});
</script></body></html>
