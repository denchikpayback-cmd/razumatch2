<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Подтверждение почты — RazuMATCH</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f5;color:#27342c;font:16px system-ui,sans-serif}.box{width:min(90vw,450px);background:white;padding:30px;border:1px solid #e3e7e1;border-radius:18px;box-sizing:border-box}h1{font-size:25px}.btn{display:inline-block;margin-top:18px;border-radius:9px;background:#4a7456;padding:13px 18px;color:white;text-decoration:none}</style></head><body><main class="box"><h1>Подтверждение почты</h1><p id="result" role="status">Проверяем ссылку…</p><a class="btn" href="/ui/index.html">Перейти ко входу</a></main><script>
const token = new URLSearchParams(location.search).get('token');
history.replaceState(null,'',location.pathname);
(async()=>{ const el=document.getElementById('result'); if(!token){el.textContent='Ссылка некорректна. Запроси новое письмо на странице входа.';return}
try{ const res=await fetch('/api/email/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}); const data=await res.json(); if(!res.ok)throw new Error(data.error||'Не удалось подтвердить почту'); el.textContent='Почта подтверждена! Теперь можно войти с email и паролем.'; }catch(err){el.textContent=err.message;}
})();
</script></body></html>
